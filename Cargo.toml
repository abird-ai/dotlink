[package]
name = "abird-tunnel"
version = "0.3.0"
edition = "2024"
description = "One-command native Rust Secure MCP Tunnel for permission-scoped local files and optional shell access."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
fastrand = "2"
hex = "0.4"
hostname = "0.4"
http = "1"
http-body-util = "0.1"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
