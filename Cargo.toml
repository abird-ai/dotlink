[package]
name = "dotlink"
version = "0.5.0"
edition = "2024"
description = "Permission-scoped local MCP bridge with OpenAI Tunnel, stdio, HTTP, and optional ngrok ingress."
license = "MIT"
repository = "https://github.com/abird-ai/dotlink"
homepage = "https://github.com/abird-ai/dotlink"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = "0.4"
crossterm = "0.29"
clap = { version = "4.5", features = ["derive"] }
fastrand = "2"
hex = "0.4"
hostname = "0.4"
http = "1"
http-body-util = "0.1"
mime_guess = "2"
ngrok = { version = "0.19", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
